
name: Build and Deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: todo-app
  ECS_CLUSTER: todo-app-cluster
  ECS_SERVICE: todo-app-service
  ECS_TASK_FAMILY: todo-app-task
  CONTAINER_NAME: app

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Debug GitHub OIDC claims
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log("OIDC Issuer:", payload.iss);
            console.log("OIDC Audience:", payload.aud);
            console.log("OIDC Subject:", payload.sub);

      # 3. Configure AWS credentials using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      # 4. Verify AWS identity
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 5. Login to Amazon ECR
      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # 6. Build and push Docker image
      - name: Build and push Docker image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

          echo "Building Docker image: $IMAGE_URI"

          docker build -t "$IMAGE_URI" .

          docker push "$IMAGE_URI"

          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      # 7. Download and update ECS task definition
      - name: Render new task definition
        env:
          IMAGE_URI: ${{ steps.build.outputs.image }}
        run: |
          aws ecs describe-task-definition \
            --task-definition "$ECS_TASK_FAMILY" \
            --query taskDefinition \
            --output json > task-def.json

          python3 - <<'PY'
          import json
          import os
          import sys

          with open("task-def.json") as f:
              td = json.load(f)

          container_name = os.environ["CONTAINER_NAME"]
          image_uri = os.environ["IMAGE_URI"]

          found = False

          for container in td["containerDefinitions"]:
              if container["name"] == container_name:
                  container["image"] = image_uri
                  found = True

          if not found:
              sys.exit(
                  f"Container '{container_name}' not found in task definition"
              )

          keep = [
              "family",
              "taskRoleArn",
              "executionRoleArn",
              "networkMode",
              "containerDefinitions",
              "volumes",
              "placementConstraints",
              "requiresCompatibilities",
              "cpu",
              "memory",
              "runtimePlatform"
          ]

          td = {k: td[k] for k in keep if k in td}

          with open("task-def.json", "w") as f:
              json.dump(td, f, indent=2)

          print("Task definition updated successfully")
          PY

      # 8. Register new ECS task definition
      - name: Register new task definition
        id: register
        run: |
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-def.json \
            --query "taskDefinition.taskDefinitionArn" \
            --output text)

          echo "task_definition=$NEW_ARN" >> "$GITHUB_OUTPUT"

          echo "Registered task definition: $NEW_ARN"

      # 9. Deploy new task definition to ECS
      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --task-definition "${{ steps.register.outputs.task_definition }}" \
            --force-new-deployment

      # 10. Wait for ECS deployment
      - name: Wait for service to stabilize
        run: |
          aws ecs wait services-stable \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE"

      # 11. Display final ECS service status
      - name: Show final service state
        run: |
          aws ecs describe-services \
            --cluster "$ECS_CLUSTER" \
            --services "$ECS_SERVICE" \
            --query "services[0].[serviceName,status,runningCount,desiredCount]" \
            --output table
